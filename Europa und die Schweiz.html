<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Europa und die Schweiz</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: Lernziel-Leiste links (Handy: Chip-Leiste oben), rechts eine Arbeitsfläche pro Lernziel mit Lernen / Karten / Quiz */
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --sunk:#F5F7F9; --ink:#15202C; --muted:#5A6676; --line:#D2D9E1;
  --accent:#C8281C; --accent-soft:#F8E3E1; --eu:#2A48A6; --eu-fill:#BFCBF0; --land:#DCE2E9; --bgland:#E7EBEF; --sea:#F7F9FB;
  --ok:#1D7A4E; --ok-soft:#DDF1E6; --bad:#A6501A; --bad-soft:#F6E6DA;
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-read:"Newsreader",Georgia,"Times New Roman",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F151C; --surface:#17202A; --sunk:#131B24; --ink:#E5EAF0; --muted:#98A4B3; --line:#2A3644;
  --accent:#F05A4D; --accent-soft:#3A1D1B; --eu:#86A0F2; --eu-fill:#2F3F7A; --land:#2B3643; --bgland:#1C252F; --sea:#121A22;
  --ok:#58C690; --ok-soft:#173326; --bad:#E8925E; --bad-soft:#3A2618; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F151C; --surface:#17202A; --sunk:#131B24; --ink:#E5EAF0; --muted:#98A4B3; --line:#2A3644;
  --accent:#F05A4D; --accent-soft:#3A1D1B; --eu:#86A0F2; --eu-fill:#2F3F7A; --land:#2B3643; --bgland:#1C252F; --sea:#121A22;
  --ok:#58C690; --ok-soft:#173326; --bad:#E8925E; --bad-soft:#3A2618; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}

/* Kopf */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 24px;padding-bottom:18px;border-bottom:2px solid var(--ink);margin-bottom:22px}
.brand .eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.brand h1{font-family:var(--f-display);font-stretch:118%;font-weight:800;font-size:clamp(26px,4.2vw,40px);line-height:1.02;margin:4px 0 0;letter-spacing:-.01em;text-wrap:balance}
.brand h1 .x{color:var(--accent)}
.overall{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.meter{min-width:200px}
.meter .lbl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:4px;font-variant-numeric:tabular-nums;gap:12px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--accent);width:0;transition:width .4s}
.btn{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--ink);background:var(--surface);padding:8px 14px;border-radius:999px;font-weight:600;font-size:14px}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.primary:hover{opacity:.9}
.btn.ghost{border-color:var(--line)}
.btn:disabled{opacity:.45;cursor:default}

/* Rahmen */
.shell{display:grid;grid-template-columns:270px minmax(0,1fr);gap:28px;align-items:start}
.nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;flex-direction:column;gap:2px}
.nav button{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:8px;text-align:left;background:none;border:0;padding:9px 10px;border-radius:8px;font-size:14px;line-height:1.25}
.nav button:hover{background:var(--surface)}
.nav button.on{background:var(--surface);box-shadow:inset 3px 0 0 var(--accent);font-weight:600}
.nav .n{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.nav .st{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--line)}
.nav .st.part{border-color:var(--accent);background:linear-gradient(90deg,var(--accent) 50%,transparent 50%)}
.nav .st.done{border-color:var(--ok);background:var(--ok)}
.nav .sep{height:1px;background:var(--line);margin:8px 10px}
.nav .exam{font-weight:600}
.nav .exam .n{color:var(--accent)}

/* Ansicht */
.view{min-width:0}
.lz-head{display:grid;gap:10px;margin-bottom:18px}
.lz-head .eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.lz-head h2{font-family:var(--f-display);font-stretch:112%;font-weight:750;font-size:clamp(22px,3vw,30px);line-height:1.1;margin:0;text-wrap:balance}
.goal{font-family:var(--f-read);font-size:17px;line-height:1.45;color:var(--muted);margin:0;max-width:72ch;font-style:italic}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--surface);border:1px solid var(--line);color:var(--muted);font-variant-numeric:tabular-nums}
.chip.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.chip.eu{background:var(--eu-fill);border-color:transparent;color:var(--ink)}
.chip.red{background:var(--accent-soft);border-color:transparent;color:var(--accent)}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
.tabs button{background:none;border:0;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:2.5px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.tabs .cnt{font-family:var(--f-mono);font-weight:400;font-size:12px;margin-left:4px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.stack{display:grid;gap:18px}
.prose{font-family:var(--f-read);font-size:17px;line-height:1.6;max-width:70ch}
.prose p{margin:0 0 .7em}
.prose strong{font-weight:600}
h3{font-family:var(--f-display);font-stretch:108%;font-weight:700;font-size:18px;margin:0 0 10px}
h4{font-family:var(--f-display);font-weight:700;font-size:15px;margin:0 0 6px}
.label{font-family:var(--f-mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:14px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:12px}
.tile{background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:14px;min-width:0}
.tile ul{margin:6px 0 0;padding-left:18px}
.tile li{margin:2px 0}
ul.clean{margin:0;padding-left:18px}
ul.clean li{margin:3px 0}
.note{border-left:3px solid var(--accent);background:var(--accent-soft);padding:10px 14px;border-radius:0 8px 8px 0;font-size:14px}
.note.eu{border-color:var(--eu);background:var(--eu-fill)}
.src{font-size:12px;color:var(--muted)}
.src a{color:var(--muted)}
a{color:var(--eu)}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:620px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--sunk);font-weight:500}
tr:last-child td{border-bottom:0}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;white-space:nowrap}
.pill.ja{background:var(--ok-soft);color:var(--ok)}
.pill.nein{background:var(--bad-soft);color:var(--bad)}
.pill.mix{background:var(--sunk);color:var(--muted);border:1px solid var(--line)}

/* Zeitstrahl */
.tl{position:relative;display:grid;gap:0;padding-left:0}
.tl-item{display:grid;grid-template-columns:76px 18px minmax(0,1fr);gap:0 12px;align-items:start}
.tl-year{font-family:var(--f-mono);font-size:13px;font-weight:500;text-align:right;padding-top:12px;font-variant-numeric:tabular-nums}
.tl-dot{position:relative;height:100%}
.tl-dot::before{content:"";position:absolute;left:8px;top:0;bottom:0;width:2px;background:var(--line)}
.tl-dot::after{content:"";position:absolute;left:3px;top:15px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--muted)}
.tl-item.k-eu .tl-dot::after{border-color:var(--eu);background:var(--eu)}
.tl-item.k-ch .tl-dot::after{border-color:var(--accent);background:var(--accent)}
.tl-item.k-era .tl-dot::after{border-radius:3px;border-color:var(--ink);background:var(--ink)}
.tl-body{padding:9px 0 14px;min-width:0}
.tl-body button.tl-t{background:none;border:0;padding:0;text-align:left;font-weight:650;font-size:15px}
.tl-body button.tl-t:hover{color:var(--accent)}
.tl-more{font-size:14px;color:var(--muted);margin-top:4px}
.vote{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12px;font-variant-numeric:tabular-nums}
.vote .vb{flex:1;max-width:260px;height:10px;border-radius:99px;background:var(--bad-soft);overflow:hidden;display:flex}
.vote .vb i{display:block;height:100%;background:var(--ok)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);margin-bottom:12px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px;background:var(--sw)}

/* Karteikarten */
.fc-wrap{display:grid;gap:14px;justify-items:center}
.fc{width:100%;max-width:620px;min-height:240px;perspective:1200px;background:none;border:0;padding:0}
.fc-in{position:relative;width:100%;min-height:240px;transition:transform .5s;transform-style:preserve-3d}
.fc.flip .fc-in{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:14px;padding:26px;display:flex;flex-direction:column;justify-content:center;gap:10px;text-align:left;border:1px solid var(--line)}
.fc-front{background:var(--surface)}
.fc-back{background:var(--ink);color:var(--bg);transform:rotateY(180deg);border-color:var(--ink)}
.fc-face .label{color:inherit;opacity:.7}
.fc-q{font-family:var(--f-display);font-stretch:105%;font-weight:700;font-size:21px;line-height:1.25;text-wrap:balance}
.fc-a{font-family:var(--f-read);font-size:17px;line-height:1.5;overflow-y:auto}
.fc-ctl{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.fc-info{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion: reduce){.fc-in{transition:none}.bar>i{transition:none}}

/* Quiz */
.qz{display:grid;gap:14px;max-width:720px}
.qz-top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.qz-q{font-family:var(--f-display);font-stretch:104%;font-weight:700;font-size:20px;line-height:1.3;margin:0;text-wrap:balance}
.qz-opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:26px 1fr;align-items:start;gap:10px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:11px 14px;font-size:15px}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt .k{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding-top:2px}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.fb{border-radius:10px;padding:12px 14px;font-size:14px}
.fb.ok{background:var(--ok-soft)}
.fb.no{background:var(--bad-soft)}
.fb b{display:block;margin-bottom:2px}
.result{display:grid;gap:12px;justify-items:start}
.big{font-family:var(--f-display);font-stretch:120%;font-weight:800;font-size:48px;line-height:1;font-variant-numeric:tabular-nums}
.review{display:grid;gap:8px;width:100%}
.review .rv{background:var(--bad-soft);border-radius:8px;padding:10px 12px;font-size:14px}

/* Zuordnen */
.sort{display:grid;gap:14px;max-width:760px}
.sort-card{background:var(--surface);border:1.5px solid var(--ink);border-radius:12px;padding:18px;font-size:17px;font-weight:600;min-height:72px;display:flex;align-items:center}
.sort-btns{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:8px}
.sort-btns button{border:1.5px solid var(--line);background:var(--sunk);border-radius:10px;padding:10px;font-weight:600;font-size:14px}
.sort-btns button:hover:not(:disabled){border-color:var(--ink)}
.sort-btns button.right{border-color:var(--ok);background:var(--ok-soft)}
.sort-btns button.wrong{border-color:var(--bad);background:var(--bad-soft)}

/* Karte */
.mapbox{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:16px;align-items:start}
.mapframe{background:var(--sea);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;position:relative}
.mapframe svg{display:block;width:100%;height:auto;touch-action:manipulation}
.mapframe .bgl{fill:var(--bgland);stroke:var(--surface);stroke-width:.5}
.mapframe .c{fill:var(--land);stroke:var(--surface);stroke-width:.7;cursor:pointer;transition:fill .15s}
.mapframe .c:hover{fill:var(--muted)}
.mapframe.showeu .c.eu{fill:var(--eu-fill)}
.mapframe .c.sel{fill:var(--accent)!important}
.mapframe .c.good{fill:var(--ok)!important}
.mapframe .c.badc{fill:var(--bad)!important}
.mapframe .c.target{fill:var(--accent)!important}
.mapframe .dot{fill:var(--land);stroke:var(--ink);stroke-width:1;cursor:pointer}
.mapframe.showeu .dot.eu{fill:var(--eu-fill);stroke:var(--eu)}
.mapframe .dot.sel,.mapframe .dot.target{fill:var(--accent)!important;stroke:var(--accent)}
.mapframe .dot.good{fill:var(--ok)!important;stroke:var(--ok)}
.mapframe .dot.badc{fill:var(--bad)!important;stroke:var(--bad)}
.mapframe .chx{fill:none;stroke:var(--accent);stroke-width:1.6;pointer-events:none}
.mapctl{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--surface);flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--bg)}
.side{display:grid;gap:10px}
.prompt{font-family:var(--f-display);font-stretch:110%;font-weight:750;font-size:22px;line-height:1.15}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600}
.small{font-size:13px;color:var(--muted)}
.capopts{display:grid;gap:6px}

/* Abstimmungsresultat */
.res-bar{display:flex;height:42px;border-radius:8px;overflow:hidden;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.res-bar div{display:flex;align-items:center;padding:0 12px}
.res-bar .y{background:var(--ok-soft);color:var(--ok)}
.res-bar .n{background:var(--bad);color:var(--surface);justify-content:flex-end;flex:1}
.range{position:relative;height:56px;margin-top:6px}
.range .track{position:absolute;left:0;right:0;top:22px;height:6px;border-radius:99px;background:linear-gradient(90deg,var(--bad-soft),var(--bad))}
.range .mk{position:absolute;top:0;transform:translateX(-50%);font-size:12px;text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap}
.range .mk::after{content:"";display:block;width:2px;height:12px;background:var(--ink);margin:2px auto 0}
.range .mk.l{transform:translateX(-1px)}.range .mk.l::after{margin-left:0}.range .mk.r{transform:translateX(calc(-100% + 1px))}.range .mk.r::after{margin-right:0;margin-left:auto}
.range .mid{position:absolute;top:34px;transform:translateX(-50%);font-size:11px;color:var(--muted)}

/* Parteien */
.party-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:12px}
.party{background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:6px;align-content:start}
.party .ph{display:flex;justify-content:space-between;align-items:center;gap:8px}
.party .ph b{font-family:var(--f-display);font-stretch:110%;font-size:17px}
.party p{margin:0;font-size:14px}
.party .q{font-family:var(--f-read);font-style:italic;color:var(--muted)}

@media (max-width:900px){
  .shell{grid-template-columns:1fr;gap:16px}
  .nav{position:static;flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:6px;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));scrollbar-width:thin}
  .nav button{grid-template-columns:auto auto;flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px}
  .nav button .t{display:none}
  .nav button.on{box-shadow:none;border-color:var(--accent);color:var(--accent)}
  .nav button .st{display:none}
  .nav .sep{display:none}
  .nav button .n::before{content:"LZ "}
  .nav button.exam .n::before{content:""}
  .mapbox{grid-template-columns:1fr}
}
@media (max-width:520px){
  .panel{padding:14px}
  .tl-item{grid-template-columns:52px 18px minmax(0,1fr);gap:0 8px}
  .tl-year{font-size:12px}
  .fc-q{font-size:18px}
  .big{font-size:40px}
}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="eyebrow">G24g · Lernziele 1. Prüfung</div>
      <h1>Europa <span class="x">+</span> die Schweiz</h1>
    </div>
    <div class="overall">
      <div class="meter">
        <div class="lbl"><span>Gesamtfortschritt</span><span id="ovTxt">0 %</span></div>
        <div class="bar"><i id="ovBar"></i></div>
      </div>
      <button class="btn primary" id="examBtn" type="button">Prüfungssimulation</button>
    </div>
  </header>
  <div class="shell">
    <nav class="nav" id="nav" aria-label="Lernziele"></nav>
    <main class="view" id="view"></main>
  </div>

<script>
/* ======================================================================
   KOMPONENTEN
   ====================================================================== */
function timeline(items){
 return `<div class="tl">${items.map((it,i)=>`<div class="tl-item k-${it.k}"><div class="tl-year">${esc(it.y)}</div><div class="tl-dot"></div>
  <div class="tl-body"><button type="button" class="tl-t" aria-expanded="false" onclick="const m=this.nextElementSibling;m.hidden=!m.hidden;this.setAttribute('aria-expanded',!m.hidden)">${esc(it.t)}</button>
  <div class="tl-more" hidden>${esc(it.d)}</div>
  ${it.v?`<div class="vote"><span class="vb"><i style="width:${it.v[0]}%"></i></span><span>${String(it.v[0]).replace(".",",")} % Ja · <b>${it.v[1]}</b></span></div>`:""}</div></div>`).join("")}</div>`;
}

function sorter(elId,items,buckets){
 const el=document.getElementById(elId); if(!el) return;
 let order=shuffle(items),i=0,score=0;
 function render(){
  if(i>=order.length){el.innerHTML=`<div class="result"><div class="big">${score}/${order.length}</div><p style="margin:0">richtig zugeordnet.</p><button class="btn" type="button">Nochmals</button></div>`;
   el.querySelector("button").onclick=()=>{order=shuffle(items);i=0;score=0;render();};return;}
  const [txt,ans]=order[i];
  el.innerHTML=`<div class="sort"><div class="qz-top"><span>Karte ${i+1} von ${order.length}</span><span>${score} richtig</span></div>
   <div class="sort-card">${esc(txt)}</div><div class="sort-btns">${buckets.map(b=>`<button type="button" data-b="${esc(b)}">${esc(b)}</button>`).join("")}</div><div class="sfb"></div></div>`;
  el.querySelectorAll(".sort-btns button").forEach(btn=>btn.onclick=()=>{
   const ok=btn.dataset.b===ans; if(ok) score++;
   el.querySelectorAll(".sort-btns button").forEach(b=>{b.disabled=true;if(b.dataset.b===ans)b.classList.add("right");});
   if(!ok) btn.classList.add("wrong");
   el.querySelector(".sfb").innerHTML=`<div class="fb ${ok?"ok":"no"}" style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><span><b style="display:inline">${ok?"Richtig.":"Nicht ganz."}</b> ${ok?"":"Richtig wäre: "+esc(ans)}</span><button class="btn" type="button">Weiter</button></div>`;
   el.querySelector(".sfb .btn").onclick=()=>{i++;render();};
   el.querySelector(".sfb .btn").focus();
  });
 }
 render();
}

/* ---------- Karteikarten ---------- */
function cardsView(lz,el){
 const s=st(lz.id); let deck=lz.cards.map((c,i)=>i); let pos=0; let onlyOpen=false;
 function list(){return onlyOpen?deck.filter(i=>!s.known.includes(i)):deck;}
 function render(){
  const L=list();
  if(!L.length){el.innerHTML=`<div class="result"><div class="big">${s.known.length}/${lz.cards.length}</div><p style="margin:0">Alle Karten als gewusst markiert.</p><div class="fc-ctl"><button class="btn" type="button" id="fcReset">Von vorne</button></div></div>`;
   $("#fcReset",el).onclick=()=>{s.known=[];save();onlyOpen=false;pos=0;render();refresh();};return;}
  if(pos>=L.length) pos=0;
  const idx=L[pos], [q,a]=lz.cards[idx], known=s.known.includes(idx);
  el.innerHTML=`<div class="fc-wrap">
   <div class="fc-info">Karte ${pos+1} von ${L.length} · ${s.known.length}/${lz.cards.length} gewusst</div>
   <button class="fc" type="button" id="fc" aria-label="Karte umdrehen"><div class="fc-in">
    <div class="fc-face fc-front"><span class="label">Frage${known?" · gewusst":""}</span><div class="fc-q">${esc(q)}</div><span class="small">Antippen zum Umdrehen</span></div>
    <div class="fc-face fc-back"><span class="label">Antwort</span><div class="fc-a">${esc(a)}</div></div></div></button>
   <div class="fc-ctl">
    <button class="btn ghost" type="button" id="fcPrev">Zurück</button>
    <button class="btn" type="button" id="fcAgain">Nochmals üben</button>
    <button class="btn primary" type="button" id="fcKnow">Gewusst</button>
   </div>
   <div class="fc-ctl"><label class="small"><input type="checkbox" id="fcOpen" ${onlyOpen?"checked":""}> nur offene Karten</label>
    <button class="btn ghost" type="button" id="fcShuf">Mischen</button></div></div>`;
  $("#fc",el).onclick=()=>$("#fc",el).classList.toggle("flip");
  $("#fcPrev",el).onclick=()=>{pos=(pos-1+L.length)%L.length;render();};
  $("#fcAgain",el).onclick=()=>{s.known=s.known.filter(k=>k!==idx);save();pos++;render();refresh();};
  $("#fcKnow",el).onclick=()=>{if(!s.known.includes(idx))s.known.push(idx);save();if(!onlyOpen)pos++;render();refresh();};
  $("#fcOpen",el).onchange=e=>{onlyOpen=e.target.checked;pos=0;render();};
  $("#fcShuf",el).onclick=()=>{deck=shuffle(deck);pos=0;render();};
 }
 render();
}

/* ---------- Quiz ---------- */
function quizView(questions,el,{onDone,title}={}){
 let qs=questions.map(q=>{const o=q.o.map((t,i)=>({t,ok:i===q.a}));return {...q,opts:shuffle(o)};});
 let i=0,score=0,wrong=[];
 function render(){
  if(i>=qs.length){
   const p=pct(score,qs.length);
   el.innerHTML=`<div class="result"><div class="label">${esc(title||"Resultat")}</div><div class="big">${score}/${qs.length}</div>
    <p style="margin:0">${p>=90?"Sitzt. Das kannst du.":p>=70?"Gut. Schau dir die Fehler noch einmal an.":"Noch nicht sicher. Lies den Lernteil und versuch es erneut."}</p>
    ${wrong.length?`<div class="review">${wrong.map(w=>`<div class="rv"><b>${esc(w.q)}</b><br>Richtig: ${esc(w.r)}</div>`).join("")}</div>`:""}
    <button class="btn primary" type="button" id="qzAgain">Nochmals</button></div>`;
   $("#qzAgain",el).onclick=()=>{qs=shuffle(qs).map(q=>({...q,opts:shuffle(q.opts)}));i=0;score=0;wrong=[];render();};
   onDone&&onDone(score,qs.length);return;}
  const q=qs[i];
  el.innerHTML=`<div class="qz"><div class="qz-top"><span>Frage ${i+1} von ${qs.length}${q.from?" · "+esc(q.from):""}</span><span>${score} richtig</span></div>
   <div class="bar"><i style="width:${pct(i,qs.length)}%"></i></div>
   <p class="qz-q">${esc(q.q)}</p>
   <div class="qz-opts">${q.opts.map((o,j)=>`<button class="opt" type="button" data-j="${j}"><span class="k">${"ABCD"[j]}</span><span>${esc(o.t)}</span></button>`).join("")}</div><div class="qfb"></div></div>`;
  el.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
   const o=q.opts[+b.dataset.j]; if(o.ok)score++; else wrong.push({q:q.q,r:q.opts.find(x=>x.ok).t});
   el.querySelectorAll(".opt").forEach((x,j)=>{x.disabled=true;if(q.opts[j].ok)x.classList.add("right");});
   if(!o.ok)b.classList.add("wrong");
   el.querySelector(".qfb").innerHTML=`<div class="fb ${o.ok?"ok":"no"}"><b>${o.ok?"Richtig.":"Nicht ganz."}</b>${esc(q.e||"")}</div>
    <div style="margin-top:10px"><button class="btn primary" type="button" id="qzNext">${i+1<qs.length?"Weiter":"Auswertung"}</button></div>`;
   $("#qzNext",el).onclick=()=>{i++;render();window.scrollTo({top:Math.min(window.scrollY,el.getBoundingClientRect().top+window.scrollY-80),behavior:"smooth"});};
   $("#qzNext",el).focus({preventScroll:true});
  });
 }
 render();
}

function mapWidgetHTML(){
 return `<div class="mapctl"><div class="seg" id="mMode">
   <button type="button" data-m="explore" class="on">Erkunden</button><button type="button" data-m="find">Länder finden</button>
   <button type="button" data-m="cap">Hauptstädte</button><button type="button" data-m="eu">EU-27 markieren</button></div>
  <div class="seg" id="mZoom"><button type="button" data-z="all" class="on">Ganz Europa</button><button type="button" data-z="mid">Mitte & Balkan</button></div></div>
 <div class="mapbox"><div class="mapframe showeu" id="mframe"></div><div class="side" id="mside"></div></div>`;
}
function mountMap(){
 const fr=document.getElementById("mframe"); if(!fr||!MAP) return;
 const full=`0 0 ${MAP.w} ${MAP.h}`, mid=MAP.zoom.join(" ");
 let html=`<svg viewBox="${full}" id="msvg" role="img" aria-label="Karte Europas"><path class="bgl" d="${MAP.bg.join("")}"/>`;
 for(const k in MAP.c){const c=MAP.c[k];html+=`<path class="c${C[k][2]?" eu":""}" data-k="${k}" d="${c.d}"><title>${C[k][0]}</title></path>`;}
 for(const k in MAP.c){const c=MAP.c[k];if(c.small)html+=`<circle class="dot${C[k][2]?" eu":""}" data-k="${k}" cx="${c.cx}" cy="${c.cy}" r="5"><title>${C[k][0]}</title></circle>`;}
 const ch=MAP.c.CH; html+=`<path class="chx" d="${ch.d}"/></svg>`;
 fr.innerHTML=html;
 const svg=$("#msvg"), side=$("#mside");
 let mode="explore", target=null, round=0, sc=0, found=new Set(), miss=0, locked=false;
 const keys=Object.keys(C);
 const els=k=>svg.querySelectorAll(`[data-k="${k}"]`);
 const clearCls=()=>svg.querySelectorAll(".sel,.good,.badc,.target").forEach(e=>e.classList.remove("sel","good","badc","target"));
 function info(k){const [n,cap,y,eur]=C[k];
  const status=y?`EU-Mitglied seit ${y}`:k==="GB"?"EU-Mitglied 1973–2020":CAND.includes(k)?"Beitrittskandidat":k==="XK"?"Potenzieller Kandidat":"kein EU-Mitglied";
  return `<div class="prompt">${n}</div><dl class="kv"><dt>Hauptstadt</dt><dd>${cap}</dd><dt>Status</dt><dd>${status}</dd>
   <dt>Euro</dt><dd>${eur?"Ja":(["MC","VA","SM","AD","ME","XK"].includes(k)?"nutzt Euro (ohne EU)":"Nein")}</dd><dt>Schengen</dt><dd>${schengen(k)?"Ja":"Nein"}</dd></dl>`;}
 function sideExplore(k){side.innerHTML=`${k?info(k):`<div class="prompt">Tippe auf ein Land</div><p class="small" style="margin:0">Blau = EU-Mitglied. Die Schweiz ist rot umrandet. Kleinstaaten sind als Punkte eingezeichnet.</p>`}
   <label class="small"><input type="checkbox" id="mEU" ${fr.classList.contains("showeu")?"checked":""}> EU-Staaten einfärben</label>`;
  $("#mEU").onchange=e=>fr.classList.toggle("showeu",e.target.checked);}
 function nextFind(){clearCls();locked=false;if(round>=10){side.innerHTML=`<div class="label">Länder finden</div><div class="big">${sc}/10</div><button class="btn primary" type="button" id="mAgain">Neue Runde</button>`;$("#mAgain").onclick=()=>{round=0;sc=0;nextFind();};return;}
  target=keys[Math.floor(Math.random()*keys.length)];
  side.innerHTML=`<div class="label">Runde ${round+1} von 10 · ${sc} richtig</div><div class="small">Tippe auf</div><div class="prompt">${C[target][0]}</div><div id="mfb"></div>`;}
 function nextCap(){clearCls();if(round>=10){side.innerHTML=`<div class="label">Hauptstädte</div><div class="big">${sc}/10</div><button class="btn primary" type="button" id="mAgain">Neue Runde</button>`;$("#mAgain").onclick=()=>{round=0;sc=0;nextCap();};return;}
  target=keys[Math.floor(Math.random()*keys.length)]; els(target).forEach(e=>e.classList.add("target"));
  const wrongs=shuffle(keys.filter(k=>k!==target)).slice(0,3).map(k=>C[k][1]);
  const opts=shuffle([C[target][1],...wrongs]);
  side.innerHTML=`<div class="label">Runde ${round+1} von 10 · ${sc} richtig</div><div class="small">Hauptstadt von</div><div class="prompt">${C[target][0]}</div>
   <div class="capopts">${opts.map(o=>`<button class="opt" type="button" style="grid-template-columns:1fr"><span>${esc(o)}</span></button>`).join("")}</div><div id="mfb"></div>`;
  side.querySelectorAll(".capopts .opt").forEach(b=>b.onclick=()=>{const ok=b.textContent===C[target][1];if(ok)sc++;
   side.querySelectorAll(".capopts .opt").forEach(x=>{x.disabled=true;if(x.textContent===C[target][1])x.classList.add("right");});if(!ok)b.classList.add("wrong");
   $("#mfb").innerHTML=`<button class="btn primary" type="button" style="margin-top:8px">Weiter</button>`;$("#mfb button").onclick=()=>{round++;nextCap();};});}
 function sideEU(){side.innerHTML=`<div class="label">EU-27 markieren</div><div class="prompt">${found.size} / 27</div><p class="small" style="margin:0">Tippe alle Mitgliedstaaten an. Fehlklicks: ${miss}</p>
   <div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn" type="button" id="mSolve">Auflösen</button><button class="btn ghost" type="button" id="mReset">Neu starten</button></div><div id="mfb"></div>`;
  $("#mSolve").onclick=()=>{EU.forEach(k=>{if(!found.has(k))els(k).forEach(e=>e.classList.add("target"));});};
  $("#mReset").onclick=()=>{found.clear();miss=0;clearCls();sideEU();};
  if(found.size===27)$("#mfb").innerHTML=`<div class="fb ok"><b>Alle 27 gefunden.</b>${miss} Fehlklicks.</div>`;}
 function setMode(m){mode=m;round=0;sc=0;found.clear();miss=0;clearCls();
  fr.classList.toggle("showeu",m==="explore");
  $("#mMode").querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.m===m));
  if(m==="explore")sideExplore(null); if(m==="find")nextFind(); if(m==="cap")nextCap(); if(m==="eu")sideEU();}
 svg.addEventListener("click",e=>{const k=e.target.dataset&&e.target.dataset.k;if(!k)return;
  if(mode==="explore"){clearCls();els(k).forEach(x=>x.classList.add("sel"));sideExplore(k);}
  else if(mode==="find"){if(locked)return;locked=true;const ok=k===target;if(ok)sc++;
   els(target).forEach(x=>x.classList.add("good"));if(!ok)els(k).forEach(x=>x.classList.add("badc"));
   $("#mfb").innerHTML=`<div class="fb ${ok?"ok":"no"}"><b>${ok?"Richtig.":"Das ist "+C[k][0]+"."}</b>${ok?"":C[target][0]+" ist grün markiert."}</div><button class="btn primary" type="button" style="margin-top:8px">Weiter</button>`;
   $("#mfb button").onclick=()=>{round++;nextFind();};}
  else if(mode==="eu"){if(EU.includes(k)){found.add(k);els(k).forEach(x=>{x.classList.remove("target");x.classList.add("good");});}else{miss++;els(k).forEach(x=>x.classList.add("badc"));setTimeout(()=>els(k).forEach(x=>x.classList.remove("badc")),700);}sideEU();}
 });
 $("#mMode").querySelectorAll("button").forEach(b=>b.onclick=()=>setMode(b.dataset.m));
 $("#mZoom").querySelectorAll("button").forEach(b=>b.onclick=()=>{svg.setAttribute("viewBox",b.dataset.z==="mid"?mid:full);
  $("#mZoom").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));
  svg.querySelectorAll(".dot").forEach(d=>d.setAttribute("r",b.dataset.z==="mid"?3.2:5));});
 setMode("explore");
}

/* ======================================================================
   NAVIGATION & FORTSCHRITT
   ====================================================================== */
const nav=$("#nav"), view=$("#view");
let cur=null, curTab="learn";
function lzState(lz){const s=st(lz.id);const q=s.best/lz.quiz.length, c=s.known.length/lz.cards.length;return {q,c,score:(q+c)/2};}
function refresh(){
 let tot=0; LZ.forEach(lz=>tot+=lzState(lz).score);
 const p=Math.round(tot/LZ.length*100); $("#ovTxt").textContent=p+" %"; $("#ovBar").style.width=p+"%";
 nav.querySelectorAll("button[data-id]").forEach(b=>{const lz=LZ.find(x=>x.id===b.dataset.id);if(!lz)return;const s=lzState(lz);
  const d=b.querySelector(".st");d.className="st"+(s.q>=.8&&s.c>=.8?" done":s.score>0?" part":"");});
 if(cur&&cur.id!=="exam"){const h=$("#lzChips");if(h)h.innerHTML=chips(cur);}
}
function chips(lz){const s=st(lz.id);return `<span class="chip ${s.best>=Math.ceil(lz.quiz.length*.8)?"ok":""}">Quiz bestes: ${s.best}/${lz.quiz.length}</span><span class="chip ${s.known.length===lz.cards.length?"ok":""}">Karten gewusst: ${s.known.length}/${lz.cards.length}</span>`;}
function buildNav(){
 nav.innerHTML=LZ.map((lz,i)=>`<button type="button" data-id="${lz.id}"><span class="n">${String(i+1).padStart(2,"0")}</span><span class="t">${esc(lz.short)}</span><span class="st"></span></button>`).join("")+
  `<div class="sep"></div><button type="button" data-id="exam" class="exam"><span class="n">★</span><span class="t">Prüfungssimulation</span><span></span></button>`;
 nav.querySelectorAll("button").forEach(b=>b.onclick=()=>go(b.dataset.id));
}
function go(id,tab){
 if(id==="exam") return exam();
 const lz=LZ.find(x=>x.id===id)||LZ[0]; cur=lz; curTab=tab||"learn";
 try{if(location.hash!=="#"+lz.id)history.replaceState(null,"","#"+lz.id);}catch(e){}
 nav.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.id===lz.id));
 const n=LZ.indexOf(lz)+1;
 view.innerHTML=`<div class="lz-head"><div class="eyebrow">Lernziel ${n} von ${LZ.length}</div><h2>${esc(lz.title)}</h2><p class="goal">${esc(lz.goal)}</p><div class="chips" id="lzChips">${chips(lz)}</div></div>
  <div class="tabs" role="tablist"><button type="button" data-t="learn">Lernen</button><button type="button" data-t="cards">Karteikarten<span class="cnt">${lz.cards.length}</span></button><button type="button" data-t="quiz">Quiz<span class="cnt">${lz.quiz.length}</span></button></div>
  <div id="tabBody"></div>
  <div style="display:flex;justify-content:space-between;gap:8px;margin-top:22px;flex-wrap:wrap">
   ${n>1?`<button class="btn ghost" type="button" id="prevLz">← ${esc(LZ[n-2].short)}</button>`:"<span></span>"}
   ${n<LZ.length?`<button class="btn ghost" type="button" id="nextLz">${esc(LZ[n].short)} →</button>`:`<button class="btn" type="button" id="nextLz">Zur Prüfungssimulation →</button>`}</div>`;
 view.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>showTab(b.dataset.t));
 if($("#prevLz"))$("#prevLz").onclick=()=>{go(LZ[n-2].id);window.scrollTo({top:0});};
 $("#nextLz").onclick=()=>{n<LZ.length?go(LZ[n].id):exam();window.scrollTo({top:0});};
 showTab(curTab);
}
function showTab(t){
 curTab=t; const lz=cur, body=$("#tabBody");
 view.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));
 if(t==="learn"){body.innerHTML=`<div class="stack">${lz.learn()}</div>`;lz.mount&&lz.mount();if(lz.id==="lz2")mountMap();}
 if(t==="cards"){body.innerHTML=`<div class="panel"></div>`;cardsView(lz,body.firstChild);}
 if(t==="quiz"){body.innerHTML=`<div class="panel"></div>`;quizView(lz.quiz,body.firstChild,{title:"Quiz "+lz.short,onDone:(sc)=>{const s=st(lz.id);if(sc>s.best){s.best=sc;save();}refresh();}});}
}
function exam(){
 cur={id:"exam"};
 try{history.replaceState(null,"","#pruefung");}catch(e){}
 nav.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.id==="exam"));
 const pool=[];LZ.forEach((lz,i)=>{shuffle(lz.quiz).slice(0,2).forEach(q=>pool.push({...q,from:"LZ "+(i+1)}));});
 const qs=shuffle(pool);
 view.innerHTML=`<div class="lz-head"><div class="eyebrow">Alle Lernziele gemischt</div><h2>Prüfungssimulation</h2><p class="goal">${qs.length} Fragen, je zwei pro Lernziel, zufällig gemischt. Am Schluss siehst du, welche Fragen du noch üben solltest.</p>
  <div class="chips"><span class="chip red">Bestes Resultat: ${S.exam||0}/${qs.length}</span></div></div><div class="panel" id="examBody"></div>
  <div style="margin-top:14px"><button class="btn ghost" type="button" id="examNew">Neue Fragen ziehen</button></div>`;
 quizView(qs,$("#examBody"),{title:"Prüfungssimulation",onDone:(sc)=>{if(sc>(S.exam||0)){S.exam=sc;save();}}});
 $("#examNew").onclick=exam;
}
window.addEventListener("hashchange",()=>{const x=(location.hash||"").slice(1);if(x==="pruefung")exam();else if(LZ.find(l=>l.id===x)&&(!cur||cur.id!==x))go(x);});
$("#examBtn").onclick=()=>{exam();window.scrollTo({top:0});};
buildNav();
const h=(location.hash||"").slice(1);
if(h==="pruefung")exam(); else go(LZ.find(x=>x.id===h)?h:"lz1");
refresh();
</script>

</body></html>
